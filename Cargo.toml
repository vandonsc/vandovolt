[package]
name = "peripheral-battery"
version = "0.1.0"
edition = "2021"
[dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security"] }
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
